version: "3"

silent: true

dotenv:
  - hack/versions.env

vars:
  GOLANGCI_LINT_TIMEOUT: 10m
  ROOT_DIR: "{{.TASKFILE_DIR}}"
  # Bazel skips targets tagged manual in //..., so this is every test that
  # needs no GPU or DCGM runtime.
  UNIT_TEST_TARGETS: //...
  # Each test task writes Bazel's event log for its runs here, and
  # test:reports reads it to find that run's results.
  BAZEL_EVENTS_DIR: "{{.TASKFILE_DIR}}/.cache/bazel-events"
  # Bazel options shared by the tests that load the DCGM runtime.
  DCGM_TEST_FLAGS: --config=ci --config=dcgm-runtime --cache_test_results=no

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  versions:validate:
    desc: Validate shared version pins
    cmds:
      - bash hack/validate-versions.sh

  bazel:gazelle:
    desc: Generate and update Bazel Go targets
    cmds:
      - bazel run //:gazelle

  bazel:tidy:
    desc: Update Bzlmod use_repo declarations and the lockfile
    cmds:
      - bazel mod tidy
      - bazel mod deps >/dev/null
      - bazel mod graph >/dev/null

  bazel:validate:
    desc: Validate Gazelle, Bzlmod metadata, and that every non-manual target builds
    cmds:
      - bazel mod graph --lockfile_mode=error >/dev/null
      - bazel run //:gazelle -- -mode=diff
      # Builds the test binaries too; task test:unit runs them.
      - bazel build --config=ci //...

  build:
    desc: Build the dcgm library and all samples
    cmds:
      - task: generate:check
      - bazel build --config=ci //pkg/dcgm:dcgm //samples/...

  build:samples:
    desc: Build all sample binaries
    cmds:
      - task: generate:check
      - bazel build --config=ci //samples/...

  test:
    desc: Run default CI-safe tests
    cmds:
      - task: test:unit

  test:unit:
    desc: Run the prerequisite-free tests; COVERAGE=true measures coverage and REPORTS=true writes the reports
    vars:
      COVERAGE: '{{.COVERAGE | default "false"}}'
      REPORTS: '{{.REPORTS | default "false"}}'
    cmds:
      - task: test:events:reset
      # Runs after a failure below so the reports still get written; the
      # explicit step at the end covers a passing run.
      - defer:
          task: test:reports:failed
          vars:
            FAILED_EXIT_CODE: "{{.EXIT_CODE}}"
            REPORTS: "{{.REPORTS}}"
      - >-
        bazel {{if eq .COVERAGE "true"}}coverage{{else}}test{{end}} --config=ci --keep_going
        --build_event_json_file="{{.BAZEL_EVENTS_DIR}}/unit.json"
        {{.UNIT_TEST_TARGETS}} {{.CLI_ARGS}}
      - task: test:reports
        if: '{{eq .REPORTS "true"}}'

  test:events:reset:
    internal: true
    desc: Empty the Bazel event log folder at the start of a test task
    cmds:
      - rm -rf "{{.BAZEL_EVENTS_DIR}}" && mkdir -p "{{.BAZEL_EVENTS_DIR}}"

  test:reports:
    desc: Write test-reports/*.xml, and tests.cov and coverage.xml after a coverage run, from the last test:unit, test:integration, test:race or test:diagnostics run
    cmds:
      - |
        set -euo pipefail
        rm -rf test-reports tests.cov coverage.xml
        mkdir -p test-reports

        shopt -s nullglob
        logs=("{{.BAZEL_EVENTS_DIR}}"/*.json)
        if [ "${#logs[@]}" -eq 0 ]; then
          echo "error: no Bazel event log in {{.BAZEL_EVENTS_DIR}}; run a test task first" >&2
          exit 1
        fi

        # Read each run's results from Bazel's own record of where they are,
        # so results of earlier runs in bazel-testlogs are left out. A retried
        # test keeps its earlier attempts under test_attempts/, so the
        # test.xml paths are the last attempt of each test or shard.
        profiles=()
        coverage_run=false
        for log in "${logs[@]}"; do
          coverage_log=false
          if grep -q '"command":"coverage"' "${log}"; then
            coverage_log=true
            coverage_run=true
          fi
          # File URIs encode characters such as spaces as %XX; decode them.
          xmls="$(grep -o '"uri":"file://[^"]*/testlogs/[^"]*/test\.xml"' "${log}" \
            | sed -e 's|^"uri":"file://||' -e 's|"$||' \
            | awk '{
                out = ""
                while (match($0, /%[0-9A-Fa-f][0-9A-Fa-f]/)) {
                  hex = tolower(substr($0, RSTART + 1, 2))
                  code = (index("0123456789abcdef", substr(hex, 1, 1)) - 1) * 16 + index("0123456789abcdef", substr(hex, 2, 1)) - 1
                  out = out substr($0, 1, RSTART - 1) sprintf("%c", code)
                  $0 = substr($0, RSTART + 3)
                }
                print out $0
              }' | sort -u || true)"
          while IFS= read -r xml; do
            if [ -z "${xml}" ]; then
              continue
            fi
            dir="$(dirname "${xml}")"
            # The path below testlogs keeps the targets' names apart.
            target="${dir#*/testlogs/}"
            cp "${xml}" "test-reports/$(printf '%s' "${target}" | tr / _).xml"
            if [ "${coverage_log}" = true ]; then
              if [ -s "${dir}/coverage.dat" ]; then
                profiles+=("${dir}/coverage.dat")
              else
                echo "warning: ${target}: the coverage run wrote no coverage.dat" >&2
              fi
            fi
          done <<< "${xmls}"
        done

        if [ -z "$(ls -A test-reports)" ]; then
          echo "error: the Bazel event logs list no test results" >&2
          exit 1
        fi
        if [ "${coverage_run}" = false ]; then
          exit 0
        fi
        if [ "${#profiles[@]}" -eq 0 ]; then
          echo "error: the coverage run wrote no coverage profiles" >&2
          exit 1
        fi

        # Each profile also lists the packages the test only imports, so a
        # block appears in many profiles: sum its counts, or keep any hit in
        # set mode.
        awk '
          FNR == 1 {
            if ($0 !~ /^mode: (set|count|atomic)$/) {
              print "error: " FILENAME ": invalid coverage mode: " $0 > "/dev/stderr"
              bad = 1
            }
            if (mode == "") mode = $0
            else if ($0 != mode) { print "coverage mode mismatch: " mode " and " $0 > "/dev/stderr"; bad = 1 }
            next
          }
          {
            key = $1 " " $2
            if (!(key in hits)) order[++n] = key
            hits[key] = (mode == "mode: set") ? (hits[key] || $3 > 0) : hits[key] + $3
          }
          END {
            if (bad) exit 1
            print mode
            for (i = 1; i <= n; i++) print order[i], hits[order[i]]
          }
        ' "${profiles[@]}" > tests.cov
        go tool cover -func=tests.cov | tail -n 1
        gocover-cobertura < tests.cov > coverage.xml

  test:reports:failed:
    internal: true
    desc: Write the test reports after a failed test run when REPORTS=true
    cmds:
      - task: test:reports
        if: '{{and (ne .FAILED_EXIT_CODE "") (eq .REPORTS "true")}}'

  test:error-metadata:
    desc: Run DCGM runtime error metadata tests
    cmds:
      - bazel test --config=ci --config=dcgm-runtime //pkg/dcgm:dcgm_test --test_filter='^TestSelectedErrorMeta$' --cache_test_results=no {{.CLI_ARGS}}

  test:gpu:prereqs:
    desc: Check that the DCGM library is installed and DCGM finds a physical GPU
    cmds:
      - nvidia-smi
      - ldconfig -p | grep libdcgm.so.4
      # Adds its log to the calling test task's logs; the folder is kept.
      - mkdir -p "{{.BAZEL_EVENTS_DIR}}"
      - bazel test {{.DCGM_TEST_FLAGS}} --build_event_json_file="{{.BAZEL_EVENTS_DIR}}/preflight.json" //tests:integration_preflight_test

  test:integration:
    desc: Run GPU and DCGM integration tests; RACE=true adds the race detector and REPORTS=true writes the reports
    vars:
      RACE: '{{.RACE | default "false"}}'
      REPORTS: '{{.REPORTS | default "false"}}'
      FLAGS: '{{.DCGM_TEST_FLAGS}}{{if eq .RACE "true"}} --config=race{{end}}'
    cmds:
      - task: test:events:reset
      - defer:
          task: test:reports:failed
          vars:
            FAILED_EXIT_CODE: "{{.EXIT_CODE}}"
            REPORTS: "{{.REPORTS}}"
      - task: test:gpu:prereqs
      # The policy tests run on their own, then the suite runs even when
      # they fail; the policy result is reported first. The diagnostic tests
      # are skipped here; task test:diagnostics runs them.
      - |
        set +e
        bazel test {{.FLAGS}} --build_event_json_file="{{.BAZEL_EVENTS_DIR}}/policy.json" \
          //pkg/dcgm:dcgm_test --test_filter='^(TestPolicyErrors|TestFieldPolicyAdapterLifecycle)$'
        policy_status=$?
        bazel test {{.FLAGS}} --build_event_json_file="{{.BAZEL_EVENTS_DIR}}/suite.json" \
          --test_env=DCGM_SKIP_DIAGNOSTICS=1 //tests:tests_test {{.CLI_ARGS}}
        suite_status=$?
        set -e
        if [ "${policy_status}" -ne 0 ]; then
          exit "${policy_status}"
        fi
        exit "${suite_status}"
      - task: test:reports
        if: '{{eq .REPORTS "true"}}'

  test:race:
    desc: Run GPU and DCGM integration tests with the race detector
    cmds:
      - task: test:integration
        vars:
          RACE: "true"
          REPORTS: '{{.REPORTS | default "false"}}'

  test:diagnostics:
    desc: Run hardware-sensitive diagnostic tests; REPORTS=true writes the reports
    vars:
      REPORTS: '{{.REPORTS | default "false"}}'
    cmds:
      - task: test:events:reset
      - defer:
          task: test:reports:failed
          vars:
            FAILED_EXIT_CODE: "{{.EXIT_CODE}}"
            REPORTS: "{{.REPORTS}}"
      # Print DCGM's own diagnostic output when the tests fail.
      - defer: |
          if [ -n "{{.EXIT_CODE}}" ]; then
            echo "DCGM diagnostic details:"
            dcgmi diag --run 1 --verbose --json || true
          fi
      - task: test:gpu:prereqs
      - bazel test {{.DCGM_TEST_FLAGS}} --build_event_json_file="{{.BAZEL_EVENTS_DIR}}/diagnostics.json" //tests:tests_test --test_filter='^(TestDiagnostics|TestDiagnosticsLong|TestDiagTestNameFormat)$' {{.CLI_ARGS}}
      - task: test:reports
        if: '{{eq .REPORTS "true"}}'

  lint:
    desc: Run Go lint; LINT_BASE_REV=<rev> reports only issues new since that revision
    vars:
      LINT_BASE_REV: '{{.LINT_BASE_REV | default ""}}'
    cmds:
      - GOFLAGS=-buildvcs=false golangci-lint run ./... --timeout {{.GOLANGCI_LINT_TIMEOUT}}{{if .LINT_BASE_REV}} --new-from-rev={{.LINT_BASE_REV}}{{end}}

  lint:shell:
    desc: Run ShellCheck over repository scripts; EXTRA_SHELL_SCRIPTS adds more paths or globs
    vars:
      EXTRA_SHELL_SCRIPTS: '{{.EXTRA_SHELL_SCRIPTS | default ""}}'
    cmds:
      # Left unquoted so the shell expands globs in EXTRA_SHELL_SCRIPTS.
      # ShellCheck takes each script's shell from its first line.
      - shellcheck -x hack/validate-versions.sh scripts/lint/go-mod-tidy.sh {{.EXTRA_SHELL_SCRIPTS}}

  fmt:
    desc: Format Go sources
    cmds:
      - gofumpt -w .

  fmt:check:
    desc: Check Go source formatting
    cmds:
      - |
        files="$(gofumpt -l .)"
        if [[ -n "${files}" ]]; then
          printf '%s\n' "${files}"
          exit 1
        fi

  generate:
    desc: Regenerate checked-in code
    cmds:
      - bazel run //cmd/gen-fields:gen-fields -- --legacy-fields {{.ROOT_DIR}}/pkg/dcgm/legacy_fields.csv {{.ROOT_DIR}}/pkg/dcgm/dcgm_fields.h {{.ROOT_DIR}}/pkg/dcgm/const_fields.go
      - gofumpt -w {{.ROOT_DIR}}/pkg/dcgm/const_fields.go
      - go generate ./pkg/dcgm

  generate:check:
    desc: Check generated code without modifying the source tree
    cmds:
      - |
        output="$(mktemp)"
        trap 'rm -f -- "${output}"' EXIT
        bazel run //cmd/gen-fields:gen-fields -- \
          --legacy-fields {{.ROOT_DIR}}/pkg/dcgm/legacy_fields.csv \
          {{.ROOT_DIR}}/pkg/dcgm/dcgm_fields.h "${output}"
        gofumpt -w "${output}"
        if ! cmp -s {{.ROOT_DIR}}/pkg/dcgm/const_fields.go "${output}"; then
          diff -u {{.ROOT_DIR}}/pkg/dcgm/const_fields.go "${output}" || true
          exit 1
        fi
      - |
        generated={{.ROOT_DIR}}/pkg/dcgm/native_calls_mock_test.go
        original="$(mktemp)"
        cp "${generated}" "${original}"
        trap 'cp "${original}" "${generated}"; rm -f -- "${original}"' EXIT
        go generate ./pkg/dcgm
        cmp -s "${original}" "${generated}" || diff -u "${original}" "${generated}"

  pre-commit:install:
    desc: Install repository pre-commit hooks
    cmds:
      - pre-commit install --config .pre-commit-config.yaml

  clean:
    desc: Remove Bazel outputs
    cmds:
      - bazel clean

  validate:static:
    desc: Check version pins, Bazel files and targets, and generated code
    cmds:
      - task: versions:validate
      - task: bazel:validate
      - task: generate:check

  validate:
    desc: Run all prerequisite-free validation, including the unit tests and ShellCheck
    cmds:
      - task: validate:static
      - task: test:unit
      - task: fmt:check
      - task: lint
      - task: lint:shell

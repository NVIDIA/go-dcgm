default: true

# MD013/line-length - Line length
MD013:
  # eventually set line_length to 80
  line_length: 500
  tables: false
  code_blocks: false

# Allow the centered README header and its badges.
MD033:
  allowed_elements:
    - a
    - div
    - img
    - p

# The centered README header appears before its H1.
MD041: false

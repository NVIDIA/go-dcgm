<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">go-dcgm</title>
  <desc id="logo-desc">An isometric cube sliced into three units. The middle unit has its front corner cut
  away and an NVIDIA Green block, half the width of each face, fitted into the notch: go-dcgm is
  the piece that fits into DCGM.
  Four green pieces frame the upper outline and a doubled chevron sits below, both taken from the
  DCGM Exporter logo. Everything sits on the same 30 degree grid.</desc>

  <!-- Same family as the DCGM Exporter logo: the same cube, the same piece size, and the same
       doubled chevron below. DCGM Exporter lights the whole middle unit and joins its pieces at
       the corners; go-dcgm lights one block and centers one piece on each upper edge.

       One light source, so tone follows the face normal, not the shape:
       up-facing #4F4F4F / #94E800, front-left #3F3F3F / #76B900,
       front-right #2B2B2B / #558500. The bottom unit steps down to #3A3A3A / #262626.
       Gaps and seams show the background. -->

  <!-- Bottom unit. -->
  <polygon points="115.6,262.1 256.0,343.1 256.0,405.2 115.6,324.2" fill="#3A3A3A"/>
  <polygon points="396.4,262.1 256.0,343.1 256.0,405.2 396.4,324.2" fill="#262626"/>

  <!-- Middle unit, with its front corner cut away. -->
  <polygon points="115.6,190.5 177.6,226.2 177.6,288.3 115.6,252.6" fill="#3F3F3F"/>
  <polygon points="396.4,190.5 334.4,226.2 334.4,288.3 396.4,252.6" fill="#2B2B2B"/>

  <!-- go-dcgm: the green block seated in the notch, exactly half of each middle face. -->
  <polygon points="185.8,231.0 256.0,271.5 256.0,333.6 185.8,293.1" fill="#76B900"/>
  <polygon points="326.2,231.0 256.0,271.5 256.0,333.6 326.2,293.1" fill="#558500"/>

  <!-- Top unit. -->
  <polygon points="256.0,37.8 396.4,118.9 256.0,199.9 115.6,118.9" fill="#4F4F4F"/>
  <polygon points="115.6,118.9 256.0,199.9 256.0,262.0 115.6,181.0" fill="#3F3F3F"/>
  <polygon points="396.4,118.9 256.0,199.9 256.0,262.0 396.4,181.0" fill="#2B2B2B"/>

  <!-- Arms along the two upper edges, centered along the grid. Same thickness, offset, and
       length as the DCGM Exporter arms; both ends run along the other 30 degree axis. -->
  <polygon points="115.7,97.1 218.3,37.9 197.4,25.8 94.8,85.0" fill="#94E800"/>
  <polygon points="293.7,37.9 396.3,97.1 417.2,85.0 314.6,25.8" fill="#94E800"/>

  <!-- Rails beside the two vertical edges, centered on them. Same size as the DCGM Exporter
       rails; both ends run parallel to the cube face on their side. -->
  <polygon points="415.2,162.3 415.2,280.7 436.1,268.6 436.1,150.2" fill="#558500"/>
  <polygon points="96.8,280.7 96.8,162.3 75.9,150.2 75.9,268.6" fill="#76B900"/>

  <!-- The DCGM Exporter's doubled chevron, at the same distance below the cube. -->
  <polygon points="153.4,367.5 256.0,426.8 256.0,451.1 153.4,391.8" fill="#76B900"/>
  <polygon points="256.0,426.8 358.6,367.5 358.6,391.8 256.0,451.1" fill="#558500"/>
  <polygon points="188.5,428.3 256.0,467.3 256.0,486.2 188.5,447.2" fill="#76B900"/>
  <polygon points="256.0,467.3 323.5,428.3 323.5,447.2 256.0,486.2" fill="#558500"/>
</svg>

# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: ''
early_access: true
enable_free_tier: true
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: ''
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false
  labeling_instructions: []
  path_filters:
    - "!vendor/**"
    - "!**/generated/**"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!coverage.xml"
    - "!test_results.json"
    - "!tests.cov"
    - "!test-reports/**"
  path_instructions:
    - path: "**/*.go"
      instructions: |
        Go production and test code for go-dcgm.
        - Treat cgo pointer misuse, data races, goroutine leaks, channel misuse, context cancellation gaps, and unbounded retries as review-blocking.
        - Public APIs and exported types need stable names, backward-compatible behavior, and meaningful comments when they are not self-explanatory.
        - Prefer focused functions, explicit errors with useful context, and table-driven tests for behavior changes.
        - Do not weaken error handling around DCGM handles, field groups, GPU groups, callbacks, policy watchers, diagnostics, topology, or health APIs.
        - New behavior should have focused unit or integration coverage unless the MR explains why GPU/DCGM hardware makes local coverage impractical.
    - path: "pkg/dcgm/**"
      instructions: |
        Core DCGM Go bindings and cgo integration.
        - Preserve Init/Shutdown reference-count behavior, embedded/standalone connection semantics, handle cleanup, and DCGM error mapping.
        - Check every C allocation, unsafe pointer, callback, field group, GPU group, and watcher for cleanup on all error paths.
        - Treat exported constants, structs, method names, error codes, and field IDs as compatibility-sensitive API surface.
    - path: "{cmd/gen-fields/**,pkg/dcgm/dcgm_fields.h,pkg/dcgm/legacy_fields.csv,pkg/dcgm/const_fields.go}"
      instructions: |
        DCGM field constant generation.
        - Header parsing, alias resolution, and legacy lowercase names must stay deterministic and covered by tests.
        - Changes to generated constants should come from generator, header, or legacy CSV changes and pass `make check-generate`.
        - Flag duplicate legacy names, changed field IDs, or parser behavior that can silently drop fields.
    - path: "samples/**"
      instructions: |
        Sample applications for the Go bindings.
        - Preserve simple runnable examples and avoid hiding required cleanup or error handling.
        - Treat REST sample input parsing, listener behavior, and HTTP error paths as security-sensitive demo code.
        - Sample changes should keep README instructions accurate.
    - path: "tests/**"
      instructions: |
        GPU/DCGM integration tests.
        - Preserve skips for hardware, driver, permission, and DCGM-version constraints.
        - Avoid making tests order-dependent or dependent on mutable global DCGM state without cleanup.
    - path: "{.gitlab-ci.yml,.github/workflows/**,Dockerfile,docker-bake.hcl,Makefile,scripts/**}"
      instructions: |
        CI, container, build, and helper scripts.
        - Preserve merge request, main branch, and sample build behavior.
        - Treat registry credentials, tokens, Docker-in-Docker setup, artifact paths, image tags, and generated-code checks as security-sensitive.
        - Keep analyzer, lint, and format jobs deterministic enough for repeatable review.
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels:
      - "!no_ai_review"
      - "!renovate"
    drafts: true
    base_branches: []
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 90
    title:
      mode: error
      requirements: ''
    description:
      mode: error
    issue_assessment:
      mode: warning
  tools:
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    golangci-lint:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    semgrep:
      enabled: true
    dotenvLint:
      enabled: true
    checkmake:
      enabled: true
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: default
    github-checks:
      enabled: false
      timeout_ms: 90000
    actionlint:
      enabled: false
    circleci:
      enabled: false
    clippy:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    phpstan:
      enabled: false
      level: default
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    pmd:
      enabled: false
    cppcheck:
      enabled: false
    buf:
      enabled: false
    prismaLint:
      enabled: false
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    swiftlint:
      enabled: false
    rubocop:
      enabled: false
    detekt:
      enabled: false
    regal:
      enabled: false
    oxc:
      enabled: false
    sqlfluff:
      enabled: false
    htmlhint:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
    brakeman:
      enabled: false
chat:
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns: []
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys:
      - DCGM
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
code_generation:
  docstrings:
    language: en-US
    path_instructions: []
  unit_tests:
    path_instructions: []

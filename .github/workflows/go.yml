name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Run the repository tasks in the development container, so local and CI
      # runs share one toolchain and one coverage path.
      - name: Build and test in the devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca  # v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          runCmd: |
            set -e
            task build
            task test:unit:coverage
            task fmt:check
            task lint
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          disable_search: true
          files: ./tests.cov
          token: ${{ secrets.CODECOV_TOKEN }}

name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Install pinned build tools
        shell: bash
        run: |
          source hack/versions.env
          mkdir -p "${RUNNER_TEMP}/bin"
          export GOBIN="${RUNNER_TEMP}/bin"
          go install "github.com/go-task/task/v3/cmd/task@v${TASK_VERSION}"
          go install "github.com/bazelbuild/bazelisk@v${BAZELISK_VERSION}"
          go install "mvdan.cc/gofumpt@v${GOFUMPT_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${GOLANGCI_LINT_VERSION}"
          ln -s "${RUNNER_TEMP}/bin/bazelisk" "${RUNNER_TEMP}/bin/bazel"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - name: Build
        run: task build
      - name: Test
        run: task test:unit
      - name: Check formatting
        run: task fmt:check
      - name: Lint
        run: task lint
